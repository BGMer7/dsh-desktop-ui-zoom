name: Check

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
      - name: Validate JSON resources
        run: |
          node -e "for (const f of ['package.json','locale/en.json','locale/zh.json','market-index.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('ok', f) }"
      - name: Check manifest essentials
        run: |
          node -e "
          const p = require('./package.json');
          for (const field of ['name','version','license','description','engines','dsh']) {
            if (p[field] === undefined) { console.error('missing field:', field); process.exit(1) }
          }
          if (p.private === true) { console.error('package.json still marks the package private'); process.exit(1) }
          if (!p.dsh.bundle?.patch) { console.error('missing dsh.bundle.patch'); process.exit(1) }
          console.log('manifest ok:', p.name + '@' + p.version);
          "
